<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meeting Room Management</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header>
    <h1>Meeting Room Management System</h1>
    <p>Manage conference rooms, create bookings, and monitor occupancy in one dashboard.</p>
  </header>

  <main>
    <section class="panel stats">
      <h2>Dashboard</h2>
      <div id="stats-grid" class="stats-grid"></div>
    </section>

    <section class="panel two-column">
      <div>
        <h2>Create Room</h2>
        <form id="room-form" class="stacked-form">
          <input id="room-name" placeholder="Room name" required />
          <input id="room-location" placeholder="Location (e.g., Floor 2)" required />
          <input id="room-capacity" type="number" min="1" placeholder="Capacity" required />
          <input id="room-amenities" placeholder="Amenities (comma-separated)" />
          <button type="submit">Add Room</button>
        </form>
      </div>
      <div>
        <h2>Rooms</h2>
        <div id="room-list" class="list"></div>
      </div>
    </section>

    <section class="panel two-column">
      <div>
        <h2>Create Booking</h2>
        <form id="booking-form" class="stacked-form">
          <select id="booking-room" required></select>
          <input id="booking-title" placeholder="Meeting title" required />
          <input id="booking-organizer" placeholder="Organizer" required />
          <input id="booking-attendees" type="number" min="1" placeholder="Attendees" required />
          <label>Start time</label>
          <input id="booking-start" type="datetime-local" required />
          <label>End time</label>
          <input id="booking-end" type="datetime-local" required />
          <button type="submit">Book Room</button>
        </form>
      </div>
      <div>
        <h2>Bookings</h2>
        <div class="row controls">
          <input id="filter-date" type="date" />
          <button id="filter-btn" type="button">Filter</button>
          <button id="clear-filter-btn" type="button" class="secondary">Clear</button>
        </div>
        <div id="booking-list" class="list"></div>
      </div>
    </section>

    <p id="status" aria-live="polite"></p>
  </main>

  <script src="/main.js"></script>
</body>
</html>
